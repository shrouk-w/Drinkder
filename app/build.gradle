plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

def envProperties = new Properties()
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    envFile.withReader('UTF-8') { reader -> envProperties.load(reader) }
}
def cocktailApiKey = envProperties.getProperty('API_KEY', '').trim()
if (cocktailApiKey && !(cocktailApiKey ==~ /[0-9]+/)) {
    throw new GradleException('API_KEY in .env must contain digits only.')
}

android {
    namespace 'com.example.drinkder'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.drinkder"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField 'String', 'COCKTAIL_API_KEY', '"' + cocktailApiKey + '"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.9"
    }
}

dependencies {

    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.androidx.runtime.android
    implementation libs.androidx.foundation.android
    implementation libs.androidx.material3.android
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation 'com.github.yuyakaido:CardStackView:v2.3.4'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "io.coil-kt:coil-compose:2.4.0"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
}
